# Uniform-random-action baseline for the steady_flight scenario. The env: and
# rollout: blocks below are byte-identical to dqn_steady_flight.yaml on
# purpose -- a baseline flown on a different task is not a baseline, and this
# is what makes its logged metrics a fair comparison against the DQN run.
# total_steps matches it for the same reason: the baselines take no gradient
# steps, so the extra frames cost ~2 min, and curves that stop at different x
# are awkward to read against each other in MLflow.
run_name: random-steady-flight
seed: 0
total_steps: 1000000
device: cpu

env:
  scenario: steady_flight
  params:
    delta:
      elevator: 0.015
      aileron: 0.015
      rudder: 0.015
      throttle: 0.1
    hold_airspeed: true
    airspeed_jitter_kts: 10.0

algo:
  type: random

rollout:
  engine: local
  n_workers: 1
  envs_per_worker: 8
  frames_per_iter: 256

tracking:
  enabled: true
  experiment: reinforced-autopilot

checkpoint:
  dir: runs/random-steady-flight/checkpoints
  interval_iters: 50
  eval_interval_iters: 50
  eval_episodes: 5
  include_buffer: false
