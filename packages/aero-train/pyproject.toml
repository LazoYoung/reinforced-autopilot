[project]
name = "aero-train"
version = "0.1.0"
description = "Distributed RL training framework for aero-gym environments"
# no `readme` key -- see the aero-gym pyproject for why
authors = [
    { name = "Chanyeong Park", email = "idealproduction@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    # the lower bound matters even though the workspace source overrides it
    # locally: uv sources are development-only and do not reach the published
    # wheel, whose metadata would otherwise read a bare `Requires-Dist: aero-gym`
    "aero-gym>=0.1.0",
    "gymnasium>=1.3.0",
    # -skinny, not full mlflow: tracking.py uses exactly seven client calls
    # (set_tracking_uri, set_experiment, start_run, log_params, log_metrics,
    # log_artifact, end_run), all of which -skinny carries along with the
    # local file store. Full mlflow pulls in a tracking *server* and a
    # modelling stack (flask, pandas, scikit-learn, docker, ...) that this
    # project never touches -- and in Phase 3 every Ray worker image would
    # inherit that tree.
    "mlflow-skinny>=3.0.0",
    "numpy>=2.5.2",
    "pyyaml>=6.0",
    "torch>=2.6.0",
]

[project.scripts]
autopilot = "aero_train.cli:main"

[project.optional-dependencies]
# autopilot export: the ONNX writer torch.onnx drives, the checker, and the
# runtime the export check flies the file in
export = [
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
]

[tool.uv.sources]
aero-gym = { workspace = true }

[tool.uv.build-backend]
module-name = "aero_train"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
