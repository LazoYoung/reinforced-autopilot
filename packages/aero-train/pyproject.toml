[project]
name = "aero-train"
version = "0.1.0"
description = "Distributed RL training framework for aero-gym environments"
# no `readme` key -- see the aero-gym pyproject for why
authors = [
    { name = "Chanyeong Park", email = "idealproduction@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    # the lower bound matters even though the workspace source overrides it
    # locally: uv sources are development-only and do not reach the published
    # wheel, whose metadata would otherwise read a bare `Requires-Dist: aero-gym`
    "aero-gym>=0.1.0",
    "gymnasium>=1.3.0",
    "mlflow>=3.0.0",
    "numpy>=2.5.2",
    "pyyaml>=6.0",
    "torch>=2.6.0",
]

[project.scripts]
autopilot = "aero_train.cli:main"

[tool.uv.sources]
aero-gym = { workspace = true }

[tool.uv.build-backend]
module-name = "aero_train"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
