[project]
name = "reinforced-autopilot"
version = "0.1.0"
description = "RL training for fixed-wing flight control"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aero-gym",
    "aero-train",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
aero-gym = { workspace = true }
aero-train = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "uv>=0.12.8",
]

[tool.pytest.ini_options]
testpaths = ["packages/aero-gym/tests", "packages/aero-train/tests"]
markers = [
    "slow: end-to-end learning tests; deselected by default",
]
addopts = ["-m", "not slow"]
